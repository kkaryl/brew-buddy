[project]
name = "brew"
version = "0.1.0"
description = "Brew — AI-powered Coffee Chat Buddy"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "fastapi<0.142.0",
    "gcsfs>=2026.10.0",
    "google-adk[bigquery-analytics,gcp,otel-gcp]>=2.12.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.scripts]
brew-dev = "app.dev_runner:main"
brew-serve = "app.server:main"

[dependency-groups]
dev = [
    "codespell>=2.2.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
    "ty>=0.0.1a0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.12.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
]
lint = [
    "codespell>=2.2.0,<3.0.0",
    "mypy>=1.14.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".venv", "artifacts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_reexport = true
exclude = ["^web/", "^\\.venv/", "^tests/eval/"]

[[tool.mypy.overrides]]
module = [
    "a2a.*",
    "google.adk.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google.genai.*",
    "google.cloud.*",
]
follow_imports = "silent"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".venv/**", "web/**"]

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./web,**/package-lock.json,**/node_modules/*"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
asyncio_default_fixture_loop_scope = "session"

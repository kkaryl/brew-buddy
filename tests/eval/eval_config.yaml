metrics_to_run:
  - coaching_guardrail_compliance
  - tool_trajectory_contract
  - brew_coaching_rubric_judge
  - custom_response_quality
  - agent_turn_count

thresholds:
  coaching_guardrail_compliance: 0.95
  tool_trajectory_contract: 0.90
  brew_coaching_rubric_judge: 4.0
  custom_response_quality: 4.0

custom_metrics:
  - name: coaching_guardrail_compliance
    custom_function_file: guardrail_compliance.py

  - name: tool_trajectory_contract
    custom_function_file: trajectory_contract.py

  - name: brew_coaching_rubric_judge
    custom_function_file: brew_coaching_judge.py

  - name: custom_response_quality
    custom_function_file: response_quality.py

  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}

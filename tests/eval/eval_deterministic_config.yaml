metrics_to_run:
  - coaching_guardrail_compliance
  - tool_trajectory_contract
  - agent_turn_count

thresholds:
  coaching_guardrail_compliance: 0.98
  tool_trajectory_contract: 0.98

custom_metrics:
  - name: coaching_guardrail_compliance
    custom_function_file: guardrail_compliance.py

  - name: tool_trajectory_contract
    custom_function_file: trajectory_contract.py

  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}

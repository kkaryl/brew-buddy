name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-quality-and-unit:
    name: Python Lint, Format, Types & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked Python dependencies
        run: |
          uv venv
          uv export --frozen --no-emit-project --no-hashes -o /tmp/requirements.ci.txt
          uv pip install --index-url https://pypi.org/simple -r /tmp/requirements.ci.txt
          uv pip install --index-url https://pypi.org/simple --no-deps -e .

      - name: Run Ruff lint & format checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Codespell check
        run: uv run codespell

      - name: Validate gcloud_setup.sh & iap_setup.sh syntax & dry-run
        run: |
          bash -n ./gcloud_setup.sh
          PROJECT_ID="brew-ci-dryrun" GITHUB_REPO="${{ github.repository }}" ENABLE_IAP="true" ./gcloud_setup.sh --dry-run
          bash -n ./iap_setup.sh
          PROJECT_ID="brew-ci-dryrun" IAP_USER_EMAIL="dev@example-org.com" IAP_CLIENT_ID="123456-iap.apps.googleusercontent.com" IAP_CLIENT_SECRET="GOCSPX-ci-dryrun" WEB_SPA_CLIENT_ID="999999-spa.apps.googleusercontent.com" ./iap_setup.sh --dry-run --yes

      - name: Run strict mypy static type checks
        run: uv run mypy app tests/unit tests/integration

      - name: Ensure ImageMagick is available for illustration cutout unit tests
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends imagemagick
          fi

      - name: Run deterministic Python unit tests
        env:
          APP_ENV: test
          BREW_PERSISTENCE_BACKEND: in_memory
          BREW_SESSION_BACKEND: in_memory
          OTEL_TO_CLOUD: 'false'
        run: uv run pytest tests/unit -v

  integration-emulators:
    name: Integration Tests (Local Firestore Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21 for Cloud Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Google Cloud SDK & Firestore Emulator
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta,cloud-firestore-emulator

      - name: Install uv & dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked Python dependencies
        run: |
          uv venv
          uv export --frozen --no-emit-project --no-hashes -o /tmp/requirements.ci.txt
          uv pip install --index-url https://pypi.org/simple -r /tmp/requirements.ci.txt
          uv pip install --index-url https://pypi.org/simple --no-deps -e .

      - name: Start local Cloud Firestore Emulator & run integration tests
        env:
          APP_ENV: test
          GOOGLE_CLOUD_PROJECT: brew-ci-emulator
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          OTEL_TO_CLOUD: 'false'
        run: |
          gcloud beta emulators firestore start --host-port=127.0.0.1:8085 --quiet >/tmp/firestore-emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "${EMULATOR_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8085/ >/dev/null 2>&1; then
              echo "Firestore Emulator ready on 127.0.0.1:8085 (attempt ${attempt})."
              break
            fi
            if [[ "${attempt}" -eq 40 ]]; then
              cat /tmp/firestore-emulator.log >&2
              echo "ERROR: Firestore Emulator failed to start within 40s." >&2
              exit 1
            fi
            sleep 1
          done

          uv run pytest tests/integration -v

  frontend-quality-and-build:
    name: Frontend Lint, Types, Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Run frontend ESLint
        run: npm --prefix web run lint

      - name: Run frontend TypeScript checks
        run: npm --prefix web run typecheck

      - name: Run frontend Vitest unit & journey tests
        run: npm --prefix web test

      - name: Build production SPA bundle
        run: |
          npm --prefix web run build
          test -f web/dist/index.html

  container-build-validation:
    name: Container Build & Runtime Smoke Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multistage production container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: brew:ci-${{ github.sha }}
          build-args: |
            AGENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate container health, readiness, SPA & memory auth gates
        run: |
          docker run -d --name brew-ci-smoke \
            -p 127.0.0.1:8080:8080 \
            -e PORT=8080 \
            -e APP_ENV=production \
            -e BREW_PERSISTENCE_BACKEND=in_memory \
            -e BREW_ALLOW_EPHEMERAL_PERSISTENCE=true \
            -e BREW_SESSION_BACKEND=in_memory \
            -e OTEL_TO_CLOUD=false \
            -e GOOGLE_OAUTH_CLIENT_ID=ci-smoke-client.apps.googleusercontent.com \
            brew:ci-${{ github.sha }}
          trap 'docker logs brew-ci-smoke || true; docker rm -f brew-ci-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo "ERROR: Container /readyz did not become ready within 30s." >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -qi '<!doctype html>'

          MEM_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/memories/propose \
            -H 'Content-Type: application/json' \
            -d '{"notes":"unauthenticated container probe"}')"
          ADK_MEM_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X PATCH http://127.0.0.1:8080/apps/app/users/u1/memory \
            -H 'Content-Type: application/json' \
            -d '{"session_id":"s1"}')"

          test "${MEM_CODE}" = "401"
          test "${ADK_MEM_CODE}" = "401"
